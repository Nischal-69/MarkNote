<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkNote PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header id="viewerBar" data-marknote="viewer-bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
          <rect width="28" height="28" rx="6" fill="#111827"/>
          <path d="M8 18.5V10l6 4.5L20 10v8.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="8" y="20.5" width="12" height="2" rx="1" fill="#FACC15"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>MarkNote PDF</h1>
        <p id="docTitle">Loading…</p>
      </div>
    </div>
    <div class="bar-right">
      <span id="pageIndicator" class="page-indicator" aria-live="polite">–</span>
      <span id="viewerPill" class="pill" role="status">
        <span class="pill-dot" aria-hidden="true"></span>
        <span id="viewerPillText">Idle</span>
      </span>
      <button id="viewerActivateBtn" class="btn-small" type="button">Activate MarkNote</button>
    </div>
  </header>

  <p id="viewerError" class="viewer-error hidden" role="alert"></p>
  <p id="viewerStatus" class="viewer-status" role="status" aria-live="polite"></p>

  <main id="pages" aria-label="PDF pages"></main>

  <div id="marknote-pdf-toolbar" data-marknote="toolbar" role="toolbar" aria-label="MarkNote annotation tools" style="display:none">
    <button class="pdf-color-btn" id="pdf-highlight-btn" type="button" data-marknote="highlight-btn" data-color="yellow" title="Highlight in Yellow" aria-label="Highlight in Yellow"></button>
    <button class="pdf-color-btn" type="button" data-marknote="highlight-btn" data-color="green" title="Highlight in Green" aria-label="Highlight in Green"></button>
    <button class="pdf-color-btn" type="button" data-marknote="highlight-btn" data-color="blue" title="Highlight in Blue" aria-label="Highlight in Blue"></button>
    <button class="pdf-color-btn" type="button" data-marknote="highlight-btn" data-color="pink" title="Highlight in Pink" aria-label="Highlight in Pink"></button>
    <button class="pdf-color-btn" type="button" data-marknote="highlight-btn" data-color="purple" title="Highlight in Purple" aria-label="Highlight in Purple"></button>
    <button id="pdf-note-btn" type="button" data-marknote="note-btn" title="Add note" aria-label="Add note"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg><span>Note</span></button>
  </div>

  <div id="marknote-pdf-panel" data-marknote="note-panel" style="display:none"></div>

  <script src="vendor/pdf.min.js"></script>
  <script src="../storage/storage.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
